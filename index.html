<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hiago Kalil — desenvolvedor mobile e web. Portfolio."
    />

    <!-- Open Graph / redes sociais. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hiago Kalil" />
    <meta property="og:url" content="https://site-portfolio-wine.vercel.app/" />
    <meta property="og:title" content="Hiago Kalil — Portfolio" />
    <meta
      property="og:description"
      content="Desenvolvedor mobile e web — React Native, TypeScript, Swift/SwiftUI, Next.js."
    />
    <meta
      property="og:image"
      content="https://site-portfolio-wine.vercel.app/og-image.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hiago Kalil — Portfolio" />
    <meta
      name="twitter:description"
      content="Desenvolvedor mobile e web — React Native, TypeScript, Swift/SwiftUI, Next.js."
    />
    <meta
      name="twitter:image"
      content="https://site-portfolio-wine.vercel.app/og-image.webp"
    />

    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", t);

        var l = localStorage.getItem("lang");
        if (l !== "pt" && l !== "en") l = "pt";
        document.documentElement.setAttribute("data-lang", l);
        document.documentElement.lang = l === "pt" ? "pt-BR" : "en";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Hiago Kalil — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
